<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌸 QR Code – Ngày Phụ Nữ Việt Nam 20/10</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:linear-gradient(135deg,#0d0010 0%,#1a003a 40%,#3d0050 70%,#0d0010 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Be Vietnam Pro',sans-serif;
      overflow:hidden;
    }
    .star{position:fixed;border-radius:50%;background:white;animation:twinkle ease-in-out infinite;}
    @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}

    .petal{position:fixed;top:-60px;animation:fall linear infinite;filter:drop-shadow(0 0 6px rgba(255,110,180,.8));}
    @keyframes fall{0%{transform:translateY(0) rotateZ(0deg);opacity:.9}100%{transform:translateY(110vh) rotateZ(720deg);opacity:0}}

    .card{
      position:relative;z-index:10;
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,110,180,.35);
      border-radius:36px;
      padding:48px 44px;
      display:flex;flex-direction:column;align-items:center;gap:24px;
      box-shadow:0 0 60px rgba(233,30,140,.25),0 0 120px rgba(233,30,140,.1);
      max-width:420px;width:90%;
    }
    .card::before{
      content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
      background:conic-gradient(from 0deg,transparent 0deg,rgba(233,30,140,.05) 60deg,transparent 120deg);
      animation:rotGlow 10s linear infinite;z-index:0;border-radius:inherit;
    }
    @keyframes rotGlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    .card-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;}

    .top-label{
      font-family:'Dancing Script',cursive;
      font-size:1.6rem;color:#f5c842;
      text-shadow:0 0 20px rgba(245,200,66,.7);
      text-align:center;
      animation:float 3s ease-in-out infinite;
    }
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

    .date-pill{
      background:linear-gradient(135deg,#e91e8c,#9c27b0,#e91e8c);
      background-size:200%;animation:gradMove 3s ease infinite;
      border-radius:40px;padding:6px 28px;
      font-size:1.1rem;font-weight:600;color:white;letter-spacing:3px;
      box-shadow:0 0 24px rgba(233,30,140,.6);
    }
    @keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    .qr-frame{
      position:relative;
      background:white;
      border-radius:20px;
      padding:14px;
      box-shadow:0 0 40px rgba(233,30,140,.5),0 0 80px rgba(233,30,140,.2);
      animation:qrPulse 2.5s ease-in-out infinite;
    }
    @keyframes qrPulse{
      0%,100%{box-shadow:0 0 40px rgba(233,30,140,.5),0 0 80px rgba(233,30,140,.2)}
      50%{box-shadow:0 0 60px rgba(255,110,180,.8),0 0 120px rgba(245,200,66,.3)}
    }
    .qr-frame img{display:block;width:220px;height:220px;border-radius:8px;}

    .corner{
      position:absolute;width:28px;height:28px;
      border-color:#e91e8c;border-style:solid;
    }
    .corner.tl{top:-6px;left:-6px;border-width:4px 0 0 4px;border-radius:6px 0 0 0;}
    .corner.tr{top:-6px;right:-6px;border-width:4px 4px 0 0;border-radius:0 6px 0 0;}
    .corner.bl{bottom:-6px;left:-6px;border-width:0 0 4px 4px;border-radius:0 0 0 6px;}
    .corner.br{bottom:-6px;right:-6px;border-width:0 4px 4px 0;border-radius:0 0 6px 0;}

    .scan-line{
      position:absolute;top:14px;left:14px;right:14px;
      height:2px;background:linear-gradient(90deg,transparent,rgba(233,30,140,.8),transparent);
      animation:scan 2.5s ease-in-out infinite;
      border-radius:2px;
      box-shadow:0 0 10px rgba(233,30,140,.8);
    }
    @keyframes scan{
      0%{top:14px;opacity:1}
      50%{top:calc(100% - 16px);opacity:1}
      100%{top:14px;opacity:1}
    }

    .qr-hint{
      font-size:.85rem;color:rgba(255,255,255,.55);
      text-align:center;letter-spacing:1px;
    }

    .bottom-text{
      font-family:'Dancing Script',cursive;
      font-size:1.3rem;color:#ffb3d9;
      text-align:center;
      text-shadow:0 0 16px rgba(255,110,180,.6);
    }

    .emoji-row{display:flex;gap:12px;font-size:1.8rem;}
    .emoji-row span{animation:bounce 1.4s ease-in-out infinite;}
    .emoji-row span:nth-child(2){animation-delay:.18s}
    .emoji-row span:nth-child(3){animation-delay:.36s}
    .emoji-row span:nth-child(4){animation-delay:.54s}
    .emoji-row span:nth-child(5){animation-delay:.72s}
    @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.2)}}
  </style>
</head>
<body>

<script>
for(let i=0;i<100;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*3+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}vh;left:${Math.random()*100}vw;animation-duration:${Math.random()*3+1.5}s;animation-delay:${Math.random()*4}s;`;
  document.body.appendChild(s);
}
const petEmoji=['🌸','🌺','💖','✨','🌹','🌷'];
for(let i=0;i<20;i++){
  const p=document.createElement('div');p.className='petal';
  p.textContent=petEmoji[Math.floor(Math.random()*petEmoji.length)];
  p.style.left=Math.random()*100+'vw';
  p.style.fontSize=(Math.random()*1.1+0.7)+'rem';
  p.style.animationDuration=(Math.random()*6+5)+'s';
  p.style.animationDelay=(Math.random()*8)+'s';
  document.body.appendChild(p);
}
</script>

<div class="card">
  <div class="card-inner">
    <div class="top-label">💝 Quét để xem món quà<br/>dành cho bạn 💝</div>
    <div class="date-pill">20 · 10</div>

    <div class="qr-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>
      <img id="qr-img" src="qrcode-20-10.png" alt="QR Code 20/10"/>
    </div>

    <p class="qr-hint">📱 Quét mã QR bằng camera điện thoại</p>

    <div style="display:flex;gap:12px;margin-top:4px;">
      <a href="qrcode-20-10.png" download="QR-Chuc-Mung-20-10.png" style="text-decoration:none;background:linear-gradient(135deg,#e91e8c,#9c27b0);color:white;padding:8px 18px;border-radius:20px;font-size:0.85rem;font-weight:600;box-shadow:0 4px 15px rgba(233,30,140,0.4);transition:all 0.2s ease;">💾 Tải ảnh QR</a>
      <a href="index.html" style="text-decoration:none;background:rgba(255,255,255,0.15);border:1px solid rgba(255,110,180,0.4);color:white;padding:8px 18px;border-radius:20px;font-size:0.85rem;font-weight:600;transition:all 0.2s ease;">✨ Xem trang chúc</a>
    </div>

    <div class="emoji-row">
      <span>🌸</span><span>💐</span><span>🌺</span><span>🌹</span><span>🌼</span>
    </div>

    <div class="bottom-text">Chúc Mừng Ngày Phụ Nữ Việt Nam 🌹</div>
  </div>
</div>

<script>
const TARGET_URL = 'https://taductoi1596-stack.github.io/ph-nu-viet-nam-20-10/';
const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&color=9c27b0&bgcolor=ffffff&data=${encodeURIComponent(TARGET_URL)}`;
document.getElementById('qr-img').src = qrApiUrl;
</script>
</body>
</html>
